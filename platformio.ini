[platformio]
default_envs = cabin

[env]
framework = arduino
monitor_speed = 115200
build_flags = -I shared

; Round dash gauge: Adafruit Qualia ESP32-S3 + 2.1" 480x480 round display.
[env:cabin]
platform = espressif32 @ ^8.0.0   ; arduino-esp32 3.x, needed by GFX Library 1.6
board = adafruit_qualia_s3_rgb666
build_src_filter = +<cabin/**>
build_flags =
  ${env.build_flags}
  -I src/cabin
  -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
  lvgl/lvgl @ ~8.3.11
  moononournation/GFX Library for Arduino @ ^1.6.0

; Same gauge fed by synthetic frames instead of CAN (no bus needed).
[env:cabin-demo]
extends = env:cabin
build_flags =
  ${env:cabin.build_flags}
  -DGAUGE_DEMO=1

[env:engine-bay]
platform = espressif32 @ ^8.0.0   ; arduino-esp32 3.x, needed by GFX Library 1.6
board = esp32-c3-devkitm-1
build_src_filter = +<engine_bay/**>
lib_deps =
  adafruit/Adafruit MAX31855 library @ ^1.4.0
  adafruit/Adafruit ADS1X15 @ ^2.4.0

[env:engine-bay-debug]
extends = env:engine-bay
build_flags =
  ${env.build_flags}
  -DDEBUG_PRINTS=1

; Climate panel temperature knob: M5Stack Dial (ESP32-S3 StampS3).
; Presses the stock TEMP up/down switches through photoMOS relays.
[env:climate]
platform = espressif32 @ ^8.0.0
board = m5stack-stamps3
build_src_filter = +<climate/**>
build_flags =
  ${env.build_flags}
  -I src/climate
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  m5stack/M5Dial @ ^1.0.3

; Host unit tests: pio test -e native
[env:native]
platform = native
framework =
build_flags = -std=gnu++17 -I shared -I src/cabin -I src/engine_bay -I src/climate -Wall -Wextra
test_build_src = no

; Renders every gauge page to docs/gauge/firmware/*.png on the host,
; from the real ui.cpp:  pio run -e gauge-preview -t exec
[env:gauge-preview]
platform = native
framework =
build_src_filter = +<cabin/ui.cpp> +<cabin/fonts/> +<preview/>
build_flags = -std=gnu++17 -I shared -I src/cabin -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
  lvgl/lvgl @ ~8.3.11
lib_compat_mode = off
